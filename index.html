<style>
@font-face{font-family:"Messiri";src:url(/assets/fonts/elmessiri-700.woff2) format("woff2");font-weight:700;font-display:swap}
@font-face{font-family:"PlexAr";src:url(/assets/fonts/plexar-400.woff2) format("woff2");font-weight:400;font-display:swap}

@font-face{font-family:"Cinzel";src:url(/assets/fonts/cinzel-800.woff2) format("woff2");font-weight:800;font-display:swap}
:root{
  --pink:#EBA1B5; --pink-hi:#F6CCD8; --blush:#FCEBF0;
  --berry:#7A2E48; --berry-2:#9B3E5E; --ink:#5C1F35; --muted:#8A5A6A;
  --card:#FFFFFF; --r:22px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;background:var(--pink)}
body{min-height:100svh;font-family:"PlexAr",system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);
  background:
    radial-gradient(120% 60% at 85% 0%, var(--pink-hi) 0%, transparent 55%),
    radial-gradient(90% 50% at 0% 100%, #E68FA7 0%, transparent 60%),
    var(--pink);
  overflow-x:hidden;-webkit-tap-highlight-color:transparent}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}

/* melting cream drip */
.drip{position:fixed;inset:0 0 auto 0;height:86px;pointer-events:none;z-index:1}
.drip svg{width:100%;height:100%;display:block}
.drop{position:absolute;width:9px;height:12px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;background:#fff;top:0;opacity:0;
  animation:fall 7s cubic-bezier(.5,0,.8,.4) infinite}
.drop:nth-of-type(1){left:13%;animation-delay:1.2s}
.drop:nth-of-type(2){left:57%;animation-delay:3.6s}
.drop:nth-of-type(3){left:83%;animation-delay:5.4s}
@keyframes fall{0%{transform:translateY(46px) scale(.4);opacity:0}8%{opacity:1;transform:translateY(58px) scale(1)}
  60%{opacity:.9}100%{transform:translateY(420px) scale(.9);opacity:0}}

/* sprinkles */
.sprinkles{position:fixed;inset:0;pointer-events:none;z-index:0}
.sprinkles i{position:absolute;width:12px;height:4px;border-radius:4px;background:#fff;opacity:.55;
  animation:float 9s ease-in-out infinite}
.sprinkles i.b{background:var(--berry);opacity:.18}
@keyframes float{0%,100%{transform:translateY(0) rotate(var(--rot))}50%{transform:translateY(-10px) rotate(calc(var(--rot) + 18deg))}}

.lang{position:fixed;top:max(14px,env(safe-area-inset-top));inset-inline-end:14px;z-index:5;
  font-weight:600;font-size:13px;letter-spacing:.02em;padding:8px 14px;border-radius:999px;
  background:rgba(255,255,255,.92);color:var(--berry);box-shadow:0 4px 14px rgba(122,46,72,.18)}
.lang:focus-visible,.btn:focus-visible,.share:focus-visible{outline:3px solid #fff;outline-offset:3px}

.wrap{position:relative;z-index:2;max-width:440px;margin:0 auto;padding:104px 20px calc(36px + env(safe-area-inset-bottom))}
.hero{text-align:center}
.mark{width:96px;height:auto;display:block;margin:0 auto 14px;filter:drop-shadow(0 6px 14px rgba(122,46,72,.22));overflow:visible}
.leaf{transform-box:view-box;transform-origin:1755px 989px;animation:sway 4.8s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3.5deg)}}
.name-ar{font-family:"Messiri","PlexAr",serif;font-weight:700;font-size:44px;line-height:1.15;color:#fff;
  text-shadow:0 2px 12px rgba(122,46,72,.25)}
.name-en{font-family:"Cinzel",serif;font-weight:800;font-size:13px;letter-spacing:.38em;color:var(--ink);margin-top:4px;
  padding-inline-start:.38em}
html[lang=en] .name-ar{order:2;font-size:15px;color:var(--ink);text-shadow:none;margin-top:6px}
html[lang=en] .name-en{order:1;font-size:34px;letter-spacing:.16em;color:#fff;margin-top:0;text-shadow:0 2px 12px rgba(122,46,72,.25)}
.names{display:flex;flex-direction:column;align-items:center}
.tagline{margin:12px auto 0;max-width:320px;font-size:15px;line-height:1.6;color:var(--ink)}

.links{display:grid;gap:12px;margin-top:28px}
.btn{position:relative;display:flex;align-items:center;gap:14px;min-height:66px;padding:12px 16px;border-radius:var(--r);
  background:var(--card);box-shadow:0 8px 22px rgba(122,46,72,.13),0 1px 0 rgba(255,255,255,.8) inset;
  transition:transform .18s cubic-bezier(.3,1.6,.5,1),box-shadow .2s;overflow:hidden;
  opacity:0;transform:translateY(14px);animation:rise .6s cubic-bezier(.2,.9,.3,1.2) forwards;animation-delay:calc(var(--i) * 70ms + 150ms)}
@keyframes rise{to{opacity:1;transform:none}}
.btn:active{transform:scale(.965)}
.ic{flex:none;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--blush);color:var(--berry)}
.ic svg{width:22px;height:22px}
.txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px;text-align:start}
.txt b{font-weight:600;font-size:16px;line-height:1.35}
.txt small{font-size:12.5px;color:var(--muted);line-height:1.4;direction:inherit}
.txt small.ltr{direction:ltr;unicode-bidi:isolate;text-align:end}
html[lang=en] .txt small.ltr{text-align:start}
.chev{flex:none;width:18px;height:18px;color:var(--berry);opacity:.55}
html[dir=rtl] .chev{transform:scaleX(-1)}
.btn.primary{background:linear-gradient(135deg,var(--berry) 0%,var(--berry-2) 100%);color:#fff}
.btn.primary .ic{background:rgba(255,255,255,.16);color:#fff}
.btn.primary small{color:rgba(255,255,255,.82)}
.btn.primary .chev{color:#fff;opacity:.8}
.btn.primary::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 30%,rgba(255,255,255,.28) 50%,transparent 70%);
  transform:translateX(-120%);animation:shine 5.5s ease-in-out 1.4s infinite}
@keyframes shine{0%{transform:translateX(-120%)}18%,100%{transform:translateX(120%)}}

.share{display:flex;align-items:center;justify-content:center;gap:8px;margin:18px auto 0;padding:11px 20px;border-radius:999px;
  font-weight:600;font-size:14px;color:var(--ink);background:rgba(255,255,255,.45);border:1px solid rgba(255,255,255,.7)}
.share svg{width:17px;height:17px}

footer{margin-top:34px;text-align:center;color:var(--ink)}
.made{display:inline-block;font-family:"Cinzel",serif;font-weight:800;font-size:11px;letter-spacing:.32em;padding-bottom:5px;
  border-bottom:2px solid #fff;color:#fff;padding-inline-start:.32em}
.copy{margin-top:10px;font-size:11.5px;opacity:.75}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translate(-50%,20px);opacity:0;z-index:9;
  background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-size:13.5px;transition:.25s}
.toast.on{opacity:1;transform:translate(-50%,0)}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .btn{opacity:1;transform:none}
  .drop{display:none}
}
</style>

/* ===== Edit links here ===== */

};

function store(k, v){ try{ if(v===undefined) return localStorage.getItem(k); localStorage.setItem(k, v);}catch(e){ return null; } }

function render(lang){
  const t = T[lang], items = [];
  const wa = CONFIG.whatsapp && "https://wa.me/" + CONFIG.whatsapp + "?text=" + encodeURIComponent(t.waMsg);
  if (wa) items.push({cls:"primary", ic:I.wa, title:t.waT, sub:t.waS, href:wa, id:"whatsapp"});
  if (CONFIG.instagram) items.push({ic:I.ig, title:t.igT, sub:"@"+CONFIG.instagram, ltr:true, href:"https://instagram.com/"+CONFIG.instagram, id:"instagram"});
  if (CONFIG.personalInstagram) items.push({ic:I.ig, title:t.pigT, sub:"@"+CONFIG.personalInstagram, ltr:true, href:"https://instagram.com/"+CONFIG.personalInstagram, id:"founder"});
  if (CONFIG.snapchat) items.push({ic:I.sc, title:t.scT, sub:"@"+CONFIG.snapchat, ltr:true, href:"https://www.snapchat.com/add/"+CONFIG.snapchat, id:"snapchat"});
  if (CONFIG.tiktok) items.push({ic:I.tt, title:t.ttT, sub:"@"+CONFIG.tiktok, ltr:true, href:"https://www.tiktok.com/@"+CONFIG.tiktok, id:"tiktok"});
  if (CONFIG.maps) items.push({ic:I.map, title:t.mapT, sub:t.mapS, href:CONFIG.maps, id:"maps"});
  if (CONFIG.email) items.push({ic:I.mail, title:t.mailT, sub:CONFIG.email, ltr:true, href:"mailto:"+CONFIG.email, id:"email"});
  items.push({ic:I.vc, title:t.vcT, sub:t.vcS, href:"/yoberry.vcf", id:"save-contact", download:true});
  document.getElementById("links").innerHTML = items.map((it, n) =>

}

function applyLang(lang){
  const h = document.documentElement;
  h.lang = lang; h.dir = lang === "ar" ? "rtl" : "ltr";
  document.querySelectorAll("[data-i18n]").forEach(el => el.textContent = T[lang][el.dataset.i18n]);
  const b = document.getElementById("lang");
  b.textContent = T[lang].other; b.lang = lang === "ar" ? "en" : "ar";
  render(lang);
  store("yb-lang", lang);
}

const q = new URLSearchParams(location.search).get("lang");
let lang = (q === "en" || q === "ar") ? q : (store("yb-lang") || "ar");
applyLang(lang);
document.getElementById("lang").addEventListener("click", () => { lang = lang === "ar" ? "en" : "ar"; applyLang(lang); });
document.getElementById("yr").textContent = new Date().getFullYear();

function toast(msg){ const t = document.getElementById("toast"); t.textContent = msg; t.classList.add("on"); setTimeout(() => t.classList.remove("on"), 1800); }
document.getElementById("share").addEventListener("click", async () => {
  const data = { title: "Yoberry · يوبيري", text: T[lang].tagline, url: CONFIG.siteUrl + "/" };
  try {
    if (navigator.share) { await navigator.share(data); return; }
    await navigator.clipboard.writeText(data.url); toast(T[lang].copied);
  } catch (e) { /* user cancelled */ }
});
</script>
